name: Build Sphinx documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_docs_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install sphinx sphinx-rtd-theme sphinx-rtd-size sphinxcontrib-bibtex

      - name: Build HTML documentation
        run: python -m sphinx -b html docs-sphinx/source docs-sphinx/_build/html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-sphinx/_build/html


